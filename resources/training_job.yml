# ═══════════════════════════════════════════════════════
# AstraZeneca — Training Job
# DAB se deploy + run hoga — no manual intervention
# ═══════════════════════════════════════════════════════

resources:
  jobs:
    training_job:
      name: "[${bundle.target}] AstraZeneca — Model Training"

      tags:
        project: astrazeneca-agentic-mlops
        environment: ${bundle.target}
        team: ml-platform

      tasks:
        - task_key: train_baseline
          existing_cluster_id: ${var.cluster_id}

          notebook_task:
            notebook_path: /src/training/train_baseline.py
            base_parameters:
              catalog: ${var.catalog}
              experiment_name: ${var.experiment_name}
              env: ${bundle.target}

      max_concurrent_runs: 1
      timeout_seconds: 3600

      email_notifications:
        on_failure:
          - rtiwarirahul123@gmail.com