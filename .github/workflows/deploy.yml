# ═══════════════════════════════════════════════════════
# AstraZeneca — CI/CD Pipeline
# GitHub Actions + Databricks Asset Bundles
# ═══════════════════════════════════════════════════════

name: AstraZeneca MLOps CI/CD

on:
  push:
    branches:
      - dev        # Dev push → Dev deploy
      - staging    # Staging push → Staging deploy
      - main       # Main push → Prod deploy

  pull_request:
    branches:
      - main       # PR to main → Validate only

# ── Permissions ──────────────────────────────────────────
permissions:
  contents: read
  pull-requests: write

jobs:

  # ════════════════════════════════════════════════════
  # JOB 1: Validate — Har branch pe
  # ════════════════════════════════════════════════════
  validate:
    name: Bundle Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate Bundle
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target dev
          echo "✅ Bundle validation passed!"

  # ════════════════════════════════════════════════════
  # JOB 2: Deploy Dev — dev branch push pe
  # ════════════════════════════════════════════════════
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Dev
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target dev
          echo "✅ Dev deployment complete!"

      - name: Run Training Job
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run training_job --target dev
          echo "✅ Training job triggered!"

  # ════════════════════════════════════════════════════
  # JOB 3: Deploy Staging — staging branch push pe
  # ════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Staging
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target staging
          echo "✅ Staging deployment complete!"

      - name: Run Training Job — Staging
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run training_job --target staging
          echo "✅ Staging training job triggered!"

  # ════════════════════════════════════════════════════
  # JOB 4: Deploy Prod — main branch push pe
  # Manual approval required
  # ════════════════════════════════════════════════════
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production    # ← Manual approval gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Production
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target prod
          echo "✅ Production deployment complete!"
