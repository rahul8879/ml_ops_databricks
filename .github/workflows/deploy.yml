name: AstraZeneca MLOps CI/CD

on:
  push:
    branches:
      - dev      # Feature development
      - main     # Staging + Prod trigger

  pull_request:
    branches:
      - main     # PR validate only

jobs:

  # ════════════════════════════════════════════════
  # JOB 1: Validate — Har branch pe
  # ════════════════════════════════════════════════
  validate:
    name: Bundle Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Validate Bundle
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate --target dev
          echo "✅ Bundle validation passed!"

  # ════════════════════════════════════════════════
  # JOB 2: Deploy Dev — dev branch pe
  # Sirf deploy — training manually run karo
  # ════════════════════════════════════════════════
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Dev
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target dev
          echo "✅ Dev deployment complete!"

      # Training job har push pe nahi
      # Sirf data/training files change hone pe
      - name: Run Training — Only if training files changed
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          # Check karo kya training files change hui hain
          git diff --name-only HEAD~1 HEAD | grep -E "src/training|src/data" && \
          databricks bundle run training_job --target dev && \
          echo "✅ Training triggered!" || \
          echo "⏭️  No training files changed — skipping training"

  # ════════════════════════════════════════════════
  # JOB 3: Deploy Staging — main branch pe
  # Databricks recommend: main → staging first
  # ════════════════════════════════════════════════
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Staging
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target staging
          echo "✅ Staging deployment complete!"

      - name: Run Staging Tests
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle run training_job --target staging
          echo "✅ Staging tests passed!"

  # ════════════════════════════════════════════════
  # JOB 4: Deploy Prod — Staging pass ke baad
  # Manual approval required
  # ════════════════════════════════════════════════
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging      # ← Staging pass hone ke baad
    environment: production    # ← Manual approval gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to Production
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target prod
          echo "✅ Production deployment complete!"


